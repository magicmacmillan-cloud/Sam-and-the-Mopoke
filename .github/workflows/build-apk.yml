name: Build Sam and the Mopoke IWAD APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'doomtc/**'
      - 'README.md'
      - 'DESIGN_SPEC.md'
      - '.github/workflows/build-apk.yml'
  push:
    branches: [main]
    paths:
      - 'doomtc/**'
      - 'README.md'
      - 'DESIGN_SPEC.md'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: sam-and-the-mopoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Sam and the Mopoke
        uses: actions/checkout@v4
        with:
          path: game

      - name: Check out Android Doom source port
        uses: actions/checkout@v4
        with:
          repository: manuelsiuro/GZDoom-Android-2026
          ref: master
          path: engine

      - name: Generate Sam and the Mopoke game data
        run: |
          set -euo pipefail
          test -s engine/doom/src/main/assets/freedoom2.wad
          python3 game/doomtc/generate_assets.py
          python3 game/doomtc/build_map.py
          python3 game/doomtc/build_iwad.py engine/doom/src/main/assets/freedoom2.wad

      - name: Validate standalone IWAD and authored environment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, struct

          wad=Path("game/doomtc/build/sam-and-the-mopoke.wad")
          b=wad.read_bytes()
          assert b[:4] == b"IWAD", b[:4]
          count,diroff=struct.unpack_from("<II",b,4)
          assert diroff + count*16 <= len(b)

          names=[]
          entries=[]
          data={}
          for i in range(count):
              pos,size,raw=struct.unpack_from("<II8s",b,diroff+i*16)
              assert pos+size <= len(b)
              name=raw.rstrip(b"\0").decode("ascii")
              body=b[pos:pos+size]
              names.append(name)
              entries.append((name,body))
              data.setdefault(name,[]).append(body)

          required={
              "SAMMPK","SAMLIC","IWADINFO","ZSCRIPT","MAPINFO","LANGUAGE","MENUDEF",
              "SBARINFO","SNDINFO","MAP01","MAP02","MAP03","MAP04","MAP05","MAP06","MAP07","MAP08","THINGS","LINEDEFS","SIDEDEFS","VERTEXES",
              "SECTORS","S_START","S_END","F_START","F_END","TX_START","TX_END",
              "SAMMUS","ZHNDA0","WSTAA0","WGAUA0","SAMRA0","MPKEA1","GOATA1","SHAMA1","CGHLA1","ZDADA0",
              "GTFGA0","CRFGA0","PSFGA0","GTGTA0","CRGTA0","PSGTA0",
              "ROTPA1","CROWA1","HUSKA1","BRUTA1","SHADA1",
              "HOUSE","KITCHEN","PINKBATH","CORRUG","PLAYGRND","FOREST","GRAVE",
              "TOMB","STATION","MALL","LIBRARY",
              "HCARPET","KTILE","PBATH","GRASS","DIRT","GRAVEFL","TOMBFL",
              "STNFLR","MALLFLR","LIBFLR","HCEIL","TOMBCE","STNCEIL",
              "MALLCEIL","LIBCEIL",
              "H42WALL","H42PANL","H42KTCH","H42BATH","H42SIDN","H42BRIK",
              "H42SHED","H42FENC","H42GATE","H42WIND","H42BLND","H42DOOR",
              "H42WDR","H42CURB","H42PLAY","H42FRNT","H42FACA","H42REAR","H42RWIN","H42RDR",
              "H42CARP","H42WOOD","H42VNYL","H42TILF","H42CONC","H42ASPH",
              "H42GRAS","H42PAVE","H42CEIL","H42ROOF","H42ATLAS",
              "H42LWN","H42VERG","H42DRV","H42PATH","H42ROAD","H42BED","H42SAFE",
              "BDKYA0","FDKYA0","PGKYA0","PHONA0","FDNTA0","PBOXA0","SGNTA0","LBOXA0",
              "D0BTA0","D1BTA0","D2BTA0","D3BTA0","D4BTA0","D5BTA0","D6BTA0","D7BTA0","D8BTA0","D9BTA0",
              "ESCOA0","XBOXA0","FRDGA0","PROJA0","PJCTA0","PJCTB0","PJCTC0","PJCTD0",
              "DOGDA0","HILXA1","HILXA5","TREEA0","TRE2A0","STLPA0","BINRA0","BINYA0","PTOWA0","HEDGA0","BRPRA0","MBXSA0","PLITA0"
          }
          required.update(f"MUSIC{i:02d}" for i in range(1,11))
          required.update({
              "SAMLA0","SAMLF0","SAMSA0","SAMSD0","SAMHA0","SAMHD0",
              "SAMEA0","SAMED0","SAMCA0","SAMCD0","SAMWA0","SAMWF0",
              "SAMRA0","SAMRF0","SAMTA0","SAMTD0","SAMFA0","SAMFF0"
          })
          missing=sorted(required-set(names))
          assert not missing, missing
          for mus in [f"MUSIC{i:02d}" for i in range(1,11)]:
              assert data[mus][-1][:4] == b"MThd", mus

          maps=[n for n in names if re.fullmatch(r"MAP\d\d",n)]
          expected=[f"MAP{i:02d}" for i in range(1,9)]
          assert maps == expected, maps

          floors=set()
          ceilings=set()
          sector_counts={}
          for mapname in expected:
              map_i=next(i for i,(n,_) in enumerate(entries) if n==mapname)
              sec_blob=None
              for n,body in entries[map_i+1:map_i+24]:
                  if n=="SECTORS":
                      sec_blob=body
                      break
              assert sec_blob is not None, mapname
              assert len(sec_blob)%26==0, mapname
              sector_count=len(sec_blob)//26
              sector_counts[mapname]=sector_count
              assert sector_count>=12, (mapname,sector_count)
              if mapname=="MAP01":
                  assert sector_count>=80, ("MAP01 should be the detailed 42 Arnold reconstruction",sector_count)
              for off in range(0,len(sec_blob),26):
                  floor,ceil,ff,cf,light,special,tag=struct.unpack_from("<hh8s8shhh",sec_blob,off)
                  floors.add(ff.rstrip(b"\0").decode("ascii"))
                  ceilings.add(cf.rstrip(b"\0").decode("ascii"))

          assert {"H42CARP","H42WOOD","H42VNYL","H42TILF","H42CONC","H42LWN","H42VERG","H42DRV","H42PATH",
                  "H42ROAD","H42SAFE","H42GRAS","H42PAVE","DIRT","GRAVEFL","TOMBFL","STNFLR","MALLFLR","LIBFLR"} <= floors
          assert {"H42CEIL","TOMBCE","STNCEIL","MALLCEIL","LIBCEIL","F_SKY1"} <= ceilings

          zscript=data["ZSCRIPT"][-1].decode("utf-8")
          for cls in (
              "ZombieHands","DemonStaff","ForbiddenAmulet","ZombieFireVirus","CursedDoll",
              "BloodOfTimShakomontus","MagicStatueOfFeeb","SqueezeBabyOfDacron",
              "ScooterWeapon","GauntletOfStones","MopokeFeatherWand","PossessedSausage",
              "JarOfDadToenails","UnholyJandal","GoatFinger","CrowFinger","PossumFinger",
              "GoatFingerGate","CrowFingerGate","PossumFingerGate","SamRunner",
              "MopokeShambler","UndeadGoat","RotPossum","CursedCrow","StationHusk",
              "MallBrute","LibraryShade","CemeteryGhoul","TombWisp","MopokeGlimpse","SamHiding","SamCompanion","TheMopoke","SamStoryHandler",
              "HouseBackDoorKey","HouseFrontDoorKey","PlaygroundGateKey","LincolnPhone42","FrontDoorPuzzleNote","HousePuzzleBox",
              "PuzzleDigit0","PuzzleDigit2","PuzzleDigit3","PuzzleDigit9","GarageEScooter42","LoungeXboxTV42","KitchenFridge42",
              "MasterProjector42","SamGateNote42","NeighbourLetterbox42","DogDigEvidence","HouseHiluxWorkmate","HouseTree2","ParkTower42","HouseHedge","BrickPier42","StaticMailbox42","PorchLight42"
          ):
              assert f"class {cls}" in zscript, cls
          assert "SAML ABCDEF" in zscript
          assert "SAMF ABCDEF" in zscript

          map_src=Path("game/doomtc/house42_map.py").read_text()
          actor_src=Path("game/doomtc/zscript/actors.zs").read_text()
          assert '"BACKDOOR"' in map_src and '"GATEDOOR"' in map_src
          assert '15740' in map_src and '15741' in map_src and '15743' in map_src and '15744' in map_src and '15745' in map_src
          assert map_src.count("15760") == 2, "MAP01 must contain exactly two e-scooter clues"
          assert map_src.count("15761") == 3, "MAP01 must contain exactly three Xbox/TV clues"
          assert "three eggs" in actor_src.lower()
          assert "2 3 3 0" in actor_src
          assert "neighbour's letterbox" in actor_src
          assert "dog dug through here" in actor_src.lower()

          # V33 visual/layout regressions that must never return.
          assert 'A(-48,16,16,3100,"LOT")' in map_src
          assert 'A(960,16,1008,3100,"LOT")' in map_src
          assert 'A(16,2944,960,3100,"LOT")' in map_src
          assert 'A(-1652,-930,-1620,-830,"GATEDOOR")' in map_src
          assert 'A(-2240,-960,-2208,-832,"GATEDOOR")' not in map_src
          assert '"IDOOR"' in map_src
          assert 'A(624,1296,688,1312,"BACKDOOR")' in map_src
          assert 'H42RWIN' in map_src and 'H42RDR' in map_src
          assert '"NBRR1"' in map_src and '"NBRR2"' in map_src
          assert '"H42LWIN"' in map_src and '"H42ROFW"' in map_src
          assert '15734' in map_src
          for ednum in ('15735','15736','15737','15738','15739'):
              assert ednum in map_src
          assert '"PLAYEQ"' not in map_src.split("AREAS = [",1)[1].split("]",1)[0]

          print(f"Standalone IWAD validation passed: {wad.stat().st_size} bytes, {count} lumps, sector counts={sector_counts}")
          PY

      - name: Package 42 Arnold builder handoff
        run: |
          set -euo pipefail
          HANDOFF=House42-Builder-Handoff
          rm -rf "$HANDOFF"
          mkdir -p "$HANDOFF/textures" "$HANDOFF/flats" "$HANDOFF/sprites" "$HANDOFF/graphics"
          cp game/HOUSE42_HANDOFF.md "$HANDOFF/"
          cp game/doomtc/house42_layout.json "$HANDOFF/"
          cp game/doomtc/house42_map.py "$HANDOFF/"
          cp game/doomtc/house42_assets.py "$HANDOFF/"
          cp game/doomtc/build_map.py "$HANDOFF/"
          cp game/doomtc/generate_assets.py "$HANDOFF/"
          cp game/doomtc/sam-and-the-mopoke-map.wad "$HANDOFF/42-Arnold-MAP01-source.wad"
          cp game/doomtc/build/sam-and-the-mopoke.wad "$HANDOFF/Sam-and-the-Mopoke-IWAD.wad"
          cp game/doomtc/textures/H42*.png "$HANDOFF/textures/"
          cp game/doomtc/flats/H42*.png "$HANDOFF/flats/"
          cp game/doomtc/sprites/H4*.png "$HANDOFF/sprites/" || true
          cp game/doomtc/graphics/H42ATLAS.png "$HANDOFF/graphics/"
          printf '%s\n' \
            '42 Arnold v3 handoff: source-driven house/street/playground MAP01.' \
            'Load Sam-and-the-Mopoke-IWAD.wad in GZDoom or inspect the source map and JSON.' \
            'Internal dimensions are reconstructed from video/aerial evidence, not a survey.' \
            > "$HANDOFF/README.txt"
          zip -qr House42-Builder-Handoff.zip "$HANDOFF"
          cp game/doomtc/build/sam-and-the-mopoke.wad Sam-and-the-Mopoke-IWAD.wad
          test -s House42-Builder-Handoff.zip
          test -s Sam-and-the-Mopoke-IWAD.wad

      - name: Upload standalone IWAD
        uses: actions/upload-artifact@v4
        with:
          name: Sam-and-the-Mopoke-IWAD
          path: Sam-and-the-Mopoke-IWAD.wad
          if-no-files-found: error
          retention-days: 7

      - name: Upload 42 Arnold builder handoff
        uses: actions/upload-artifact@v4
        with:
          name: House42-Builder-Handoff
          path: House42-Builder-Handoff.zip
          if-no-files-found: error
          retention-days: 7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Install only the Sam and the Mopoke IWAD
        run: |
          set -euo pipefail
          ASSETS=engine/doom/src/main/assets
          mkdir -p "$ASSETS"
          cp game/doomtc/build/sam-and-the-mopoke.wad "$ASSETS/"
          rm -f "$ASSETS/freedoom1.wad" "$ASSETS/freedoom2.wad" "$ASSETS/freedoom-manual.pdf"
          rm -f "$ASSETS/sam-and-the-mopoke.pk3" "$ASSETS/sam-and-the-mopoke-map.wad"
          test -s "$ASSETS/sam-and-the-mopoke.wad"

      - name: Brand launcher and boot the IWAD directly
        working-directory: engine
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path("doom/src/main/res/values/strings.xml")
          s=p.read_text()
          s=s.replace('<string name="app_name">Freedoom</string>',
                      '<string name="app_name">Sam and the Mopoke</string>')
          s=s.replace('Welcome to Freedoom','Sam and the Mopoke')
          p.write_text(s)

          p=Path("doom/build.gradle.kts")
          s=p.read_text().replace(
              'applicationId = "com.msa.freedoom"',
              'applicationId = "com.samandthemopoke.game"'
          )
          p.write_text(s)

          p=Path("doom/src/main/java/com/msa/freedoom/Utils.kt")
          lines=p.read_text().splitlines()
          lines=[line for line in lines if 'copyAsset' not in line or ('freedoom1.wad' not in line and 'freedoom2.wad' not in line)]
          p.write_text("\n".join(lines)+"\n")

          # Keep Android component class names independent from the rebranded
          # applicationId. This prevents ActivityNotFoundException at startup.
          p=Path("doom/src/main/AndroidManifest.xml")
          manifest=p.read_text()
          manifest=manifest.replace(
              'android:name=".EntryActivity"',
              'android:name="com.msa.freedoom.EntryActivity"'
          )
          manifest=manifest.replace(
              'android:name=".Game"',
              'android:name="com.msa.freedoom.Game"'
          )
          if 'android:name="com.msa.freedoom.EntryActivity"' not in manifest:
              raise SystemExit("EntryActivity is not declared in AndroidManifest.xml")
          if 'android:name="com.msa.freedoom.Game"' not in manifest:
              raise SystemExit("Game activity is not declared in AndroidManifest.xml")
          p.write_text(manifest)
          PY

          cat > doom/src/main/java/com/msa/freedoom/EntryActivity.kt <<'KOT'
          package com.msa.freedoom

          import android.content.Intent
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import com.beloko.touchcontrols.GamePadFragment
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          class EntryActivity : AppCompatActivity() {
              private var launched = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (launched) return
                  launched = true

                  AppSettings.reloadSettings(application)
                  AppSettings.resetBaseDir(application)
                  GamePadFragment.gamepadActions = Utils.getGameGamepadConfig(resources)

                  lifecycleScope.launch {
                      val base = AppSettings.getQuakeFullDir()
                      withContext(Dispatchers.IO) {
                          AppSettings.createDirectories(application)
                          Utils.copyAsset(this@EntryActivity, "sam-and-the-mopoke.wad", base)
                          Utils.copyAsset(this@EntryActivity, "uzdoom.pk3", "$base/res")
                          Utils.copyAsset(this@EntryActivity, "uzdoom_game_support.pk3", "$base/res")
                          Utils.copyAsset(this@EntryActivity, "game_widescreen_gfx.pk3", base)
                          Utils.copyAsset(this@EntryActivity, "lights.pk3", base)
                          Utils.copyAsset(this@EntryActivity, "brightmaps.pk3", base)
                          Utils.copyAsset(this@EntryActivity, "gzdoom.sf2", base)
                          Utils.copyAsset(this@EntryActivity, "gzdoom.sf2", "$base/soundfonts")
                      }

                      startActivity(Intent(this@EntryActivity, Game::class.java).apply {
                          action = Intent.ACTION_MAIN
                          putExtra("res_div", AppSettings.getIntOption(this@EntryActivity, "gzdoom_res_div", 1))
                          putExtra("game_path", base)
                          putExtra("game", "com.samandthemopoke.game")
                          putExtra("args", "-iwad sam-and-the-mopoke.wad +map MAP01")
                      })
                      finish()
                  }
              }
          }
          KOT

      - name: Build Android Doom APK
        working-directory: engine
        run: |
          set -euo pipefail
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :doom:assembleDebug --stacktrace

      - name: Verify APK ships one standalone game IWAD
        run: |
          set -euo pipefail
          APK="$(find engine/doom/build/outputs/apk -type f -name '*debug*.apk' | head -n1)"
          test -n "$APK"
          python3 - "$APK" <<'PY'
          import sys, zipfile
          apk=sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              names=set(z.namelist())
              target="assets/sam-and-the-mopoke.wad"
              assert target in names
              assert "assets/freedoom2.wad" not in names
              assert "assets/sam-and-the-mopoke.pk3" not in names
              assert "assets/sam-and-the-mopoke-map.wad" not in names
              with z.open(target) as f:
                  assert f.read(4) == b"IWAD"
          print("APK contains the standalone Sam and the Mopoke IWAD and no external game-data mod stack")
          PY
          # Verify the exact launch contract in the final packaged APK.
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | head -n1)"
          test -x "$APKANALYZER"
          APP_ID="$("$APKANALYZER" manifest application-id "$APK")"
          test "$APP_ID" = "com.samandthemopoke.game"
          "$APKANALYZER" manifest print "$APK" > /tmp/mopoke-manifest.txt
          grep -Fq 'com.msa.freedoom.EntryActivity' /tmp/mopoke-manifest.txt
          grep -Fq 'com.msa.freedoom.Game' /tmp/mopoke-manifest.txt
          grep -Fq 'android.intent.action.MAIN' /tmp/mopoke-manifest.txt
          grep -Fq 'android.intent.category.LAUNCHER' /tmp/mopoke-manifest.txt

          rm -rf /tmp/mopoke-dex && mkdir -p /tmp/mopoke-dex
          unzip -q "$APK" 'classes*.dex' -d /tmp/mopoke-dex
          strings /tmp/mopoke-dex/classes*.dex | grep -Fq 'Lcom/msa/freedoom/EntryActivity;'
          echo "Launch contract verified: $APP_ID -> com.msa.freedoom.EntryActivity"
          cp "$APK" Sam-and-the-Mopoke-IWAD-debug.apk

      - name: Upload Sam and the Mopoke APK
        uses: actions/upload-artifact@v4
        with:
          name: Sam-and-the-Mopoke-IWAD-APK
          path: Sam-and-the-Mopoke-IWAD-debug.apk
          if-no-files-found: error
          retention-days: 3
