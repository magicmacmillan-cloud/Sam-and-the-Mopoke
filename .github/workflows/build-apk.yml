name: Build Sam and the Mopoke Doom II APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'doomtc/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: sam-and-the-mopoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: game

      - name: Generate and package Doom II mod
        run: |
          set -euo pipefail
          python3 game/doomtc/generate_assets.py
          python3 game/doomtc/build_map.py
          python3 game/doomtc/pack_tc.py

      - name: Validate clean Doom-format content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct, zipfile

          root=Path("game/doomtc")
          wad=root/"sam-test-map.wad"
          pk3=root/"build/sam-and-the-mopoke.pk3"

          b=wad.read_bytes()
          assert b[:4] == b"PWAD"
          count,diroff=struct.unpack_from("<II",b,4)
          names=[]
          for i in range(count):
              pos,size,name=struct.unpack_from("<II8s",b,diroff+i*16)
              assert pos+size <= len(b)
              names.append(name.rstrip(b"\0").decode("ascii"))
          for required in ("SAMMPK","MAP01","THINGS","LINEDEFS","SIDEDEFS","VERTEXES","SECTORS"):
              assert required in names, required

          with zipfile.ZipFile(pk3) as z:
              files=set(z.namelist())
              for required in (
                  "MAPINFO","LANGUAGE","MENUDEF","SBARINFO","SNDINFO","zscript.txt",
                  "zscript/player.zs","zscript/weapons.zs","zscript/actors.zs",
                  "sprites/ZHNDA0.png","sprites/WSTAA0.png","sprites/WGAUA0.png",
                  "sprites/SAMRA0.png","sprites/MPKEA0.png","sprites/ZDADA0.png",
                  "graphics/DADST00.png","graphics/STBAR.png"
              ):
                  assert required in files, required
              weapons=z.read("zscript/weapons.zs").decode("utf-8")
              for name in (
                  "ZombieHands","DemonStaff","ForbiddenAmulet","ZombieFireVirus","CursedDoll",
                  "BloodOfTimShakomontus","MagicStatueOfFeeb","SqueezeBabyOfDacron",
                  "ScooterWeapon","GauntletOfStones","MopokeFeatherWand",
                  "PossessedSausage","JarOfDadToenails","UnholyJandal"
              ):
                  assert f"class {name}" in weapons, name
              assert not any("Mopoke2D/" in x for x in files)
          print("Doom-format mod validation passed")
          PY

      - name: Check out Android Doom source port
        uses: actions/checkout@v4
        with:
          repository: manuelsiuro/GZDoom-Android-2026
          ref: master
          path: engine

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Sam and the Mopoke Doom assets
        run: |
          set -euo pipefail
          mkdir -p engine/doom/src/main/assets
          cp game/doomtc/build/sam-and-the-mopoke.pk3 engine/doom/src/main/assets/
          cp game/doomtc/sam-test-map.wad engine/doom/src/main/assets/
          test -s engine/doom/src/main/assets/freedoom2.wad
          rm -f engine/doom/src/main/assets/freedoom1.wad engine/doom/src/main/assets/freedoom-manual.pdf

      - name: Brand launcher and boot the Doom II mod directly
        working-directory: engine
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("doom/src/main/res/values/strings.xml")
          s=p.read_text()
          s=s.replace('<string name="app_name">Freedoom</string>',
                      '<string name="app_name">Sam and the Mopoke</string>')
          s=s.replace('Welcome to Freedoom','Sam and the Mopoke')
          p.write_text(s)

          p=Path("doom/build.gradle.kts")
          s=p.read_text().replace(
              'applicationId = "com.msa.freedoom"',
              'applicationId = "com.samandthemopoke.game"'
          )
          p.write_text(s)

          p=Path("doom/src/main/java/com/msa/freedoom/Utils.kt")
          s=p.read_text().replace(
              'copyAsset(responsibleActivity, "freedoom1.wad", fullBaseDir)', ''
          )
          p.write_text(s)
          PY

          cat > doom/src/main/java/com/msa/freedoom/EntryActivity.kt <<'KOT'
          package com.msa.freedoom

          import android.content.Intent
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import com.beloko.touchcontrols.GamePadFragment
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          class EntryActivity : AppCompatActivity() {
              private var launched = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (launched) return
                  launched = true

                  AppSettings.reloadSettings(application)
                  AppSettings.resetBaseDir(application)
                  GamePadFragment.gamepadActions = Utils.getGameGamepadConfig(resources)

                  lifecycleScope.launch {
                      val base = AppSettings.getQuakeFullDir()
                      withContext(Dispatchers.IO) {
                          AppSettings.createDirectories(application)
                          Utils.copyAsset(this@EntryActivity, "sam-and-the-mopoke.pk3", base)
                          Utils.copyAsset(this@EntryActivity, "sam-test-map.wad", base)
                          Utils.copyAsset(this@EntryActivity, "freedoom2.wad", base)
                          Utils.copyAsset(this@EntryActivity, "uzdoom.pk3", "$base/res")
                          Utils.copyAsset(this@EntryActivity, "uzdoom_game_support.pk3", "$base/res")
                          Utils.copyAsset(this@EntryActivity, "game_widescreen_gfx.pk3", base)
                          Utils.copyAsset(this@EntryActivity, "lights.pk3", base)
                          Utils.copyAsset(this@EntryActivity, "brightmaps.pk3", base)
                          Utils.copyAsset(this@EntryActivity, "gzdoom.sf2", base)
                          Utils.copyAsset(this@EntryActivity, "gzdoom.sf2", "$base/soundfonts")
                      }

                      startActivity(Intent(this@EntryActivity, Game::class.java).apply {
                          action = Intent.ACTION_MAIN
                          putExtra("res_div", AppSettings.getIntOption(this@EntryActivity, "gzdoom_res_div", 1))
                          putExtra("game_path", base)
                          putExtra("game", "com.samandthemopoke.game")
                          putExtra("args", "-iwad freedoom2.wad -file sam-test-map.wad sam-and-the-mopoke.pk3 +map MAP01")
                      })
                      finish()
                  }
              }
          }
          KOT

      - name: Build Android Doom APK
        working-directory: engine
        run: |
          set -euo pipefail
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :doom:assembleDebug --stacktrace

      - name: Verify APK contains free Doom II base and Sam mod
        run: |
          set -euo pipefail
          APK="$(find engine/doom/build/outputs/apk -type f -name '*debug*.apk' | head -n1)"
          test -n "$APK"
          unzip -l "$APK" > /tmp/apk-list.txt
          grep -q 'assets/freedoom2.wad' /tmp/apk-list.txt
          grep -q 'assets/sam-test-map.wad' /tmp/apk-list.txt
          grep -q 'assets/sam-and-the-mopoke.pk3' /tmp/apk-list.txt
          cp "$APK" Sam-and-the-Mopoke-Doom2-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Sam-and-the-Mopoke-Doom2-APK
          path: Sam-and-the-Mopoke-Doom2-debug.apk
          if-no-files-found: error
          retention-days: 3
