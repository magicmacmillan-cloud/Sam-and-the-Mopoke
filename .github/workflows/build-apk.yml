name: Build Sam and the Mopoke IWAD APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'doomtc/**'
      - 'README.md'
      - 'DESIGN_SPEC.md'
      - '.github/workflows/build-apk.yml'
  push:
    branches: [main]
    paths:
      - 'doomtc/**'
      - 'README.md'
      - 'DESIGN_SPEC.md'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: sam-and-the-mopoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Sam and the Mopoke
        uses: actions/checkout@v4
        with:
          path: game

      - name: Check out Android Doom source port
        uses: actions/checkout@v4
        with:
          repository: manuelsiuro/GZDoom-Android-2026
          ref: master
          path: engine

      - name: Generate Sam and the Mopoke game data
        run: |
          set -euo pipefail
          test -s engine/doom/src/main/assets/freedoom2.wad
          python3 game/doomtc/generate_assets.py
          python3 game/doomtc/build_map.py
          python3 game/doomtc/build_iwad.py engine/doom/src/main/assets/freedoom2.wad
          # Repair placement in the exact WAD that will be installed. This avoids
          # double-offset first-person canvases and upward-shifted HUD art.
          python3 game/doomtc/repair_iwad_offsets.py game/doomtc/build/sam-and-the-mopoke.wad

      - name: Validate standalone IWAD and authored environment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, struct

          wad=Path("game/doomtc/build/sam-and-the-mopoke.wad")
          b=wad.read_bytes()
          assert b[:4] == b"IWAD", b[:4]
          count,diroff=struct.unpack_from("<II",b,4)
          assert diroff + count*16 <= len(b)

          names=[]
          entries=[]
          data={}
          for i in range(count):
              pos,size,raw=struct.unpack_from("<II8s",b,diroff+i*16)
              assert pos+size <= len(b)
              name=raw.rstrip(b"\0").decode("ascii")
              body=b[pos:pos+size]
              names.append(name)
              entries.append((name,body))
              data.setdefault(name,[]).append(body)

          required={
              "SAMMPK","SAMLIC","IWADINFO","ZSCRIPT","MAPINFO","LANGUAGE","MENUDEF",
              "SBARINFO","SNDINFO","MAP01","MAP02","MAP03","MAP04","MAP05","MAP06","MAP07","MAP08","THINGS","LINEDEFS","SIDEDEFS","VERTEXES",
              "SECTORS","S_START","S_END","F_START","F_END","TX_START","TX_END",
              "SAMMUS","ZHNDA0","WSTAA0","WGAUA0","SAMRA0","MPKEA1","GOATA1","SHAMA1","CGHLA1","ZDADA0",
              "GTFGA0","CRFGA0","PSFGA0","GTGTA0","CRGTA0","PSGTA0",
              "ROTPA1","CROWA1","HUSKA1","BRUTA1","SHADA1",
              "HOUSE","KITCHEN","PINKBATH","CORRUG","PLAYGRND","FOREST","GRAVE",
              "TOMB","STATION","MALL","LIBRARY",
              "HCARPET","KTILE","PBATH","GRASS","DIRT","GRAVEFL","TOMBFL",
              "STNFLR","MALLFLR","LIBFLR","HCEIL","TOMBCE","STNCEIL",
              "MALLCEIL","LIBCEIL",
              "DBELA0","SSDBELL",
              "STLPA0","TREEA0","CARWA0","CARDA0","BNCHA0","SWNGA0","SLIDA0","CLMBA0","WBINA0",
              "H42WALL","H42PANL","H42KTCH","H42BATH","H42SIDN","H42BRIK",
              "H42SHED","H42FENC","H42GATE","H42WIND","H42BLND","H42DOOR",
              "H42WDR","H42FRNT","H42SOFA","H42APPL","H42CURB","H42PLAY",
              "H42CARP","H42WOOD","H42VNYL","H42TILF","H42CONC","H42ASPH",
              "H42GRAS","H42PAVE","H42CEIL","H42ROOF"
          }
          required.update(f"MUSIC{i:02d}" for i in range(1,11))
          required.update({
              "SAMLA0","SAMLF0","SAMSA0","SAMSD0","SAMHA0","SAMHD0",
              "SAMEA0","SAMED0","SAMCA0","SAMCD0","SAMWA0","SAMWF0",
              "SAMRA0","SAMRF0","SAMTA0","SAMTD0","SAMFA0","SAMFF0"
          })
          missing=sorted(required-set(names))
          assert not missing, missing
          for mus in [f"MUSIC{i:02d}" for i in range(1,11)]:
              assert data[mus][-1][:4] == b"MThd", mus

          maps=[n for n in names if re.fullmatch(r"MAP\d\d",n)]
          expected=[f"MAP{i:02d}" for i in range(1,9)]
          assert maps == expected, maps

          floors=set()
          ceilings=set()
          sector_counts={}
          for mapname in expected:
              map_i=next(i for i,(n,_) in enumerate(entries) if n==mapname)
              sec_blob=None
              for n,body in entries[map_i+1:map_i+24]:
                  if n=="SECTORS":
                      sec_blob=body
                      break
              assert sec_blob is not None, mapname
              assert len(sec_blob)%26==0, mapname
              sector_count=len(sec_blob)//26
              sector_counts[mapname]=sector_count
              assert sector_count>=12, (mapname,sector_count)
              if mapname=="MAP01":
                  assert sector_count>=1000, ("MAP01 should be the detailed 42 Arnold reconstruction",sector_count)
              for off in range(0,len(sec_blob),26):
                  floor,ceil,ff,cf,light,special,tag=struct.unpack_from("<hh8s8shhh",sec_blob,off)
                  floors.add(ff.rstrip(b"\0").decode("ascii"))
                  ceilings.add(cf.rstrip(b"\0").decode("ascii"))

          assert {"H42CARP","H42WOOD","H42VNYL","H42TILF","H42CONC","H42ASPH","H42GRAS","H42PAVE",
                  "DIRT","GRAVEFL","TOMBFL","STNFLR","MALLFLR","LIBFLR"} <= floors
          assert {"H42CEIL","TOMBCE","STNCEIL","MALLCEIL","LIBCEIL","F_SKY1"} <= ceilings

          zscript=data["ZSCRIPT"][-1].decode("utf-8")
          for cls in (
              "ZombieHands","DemonStaff","ForbiddenAmulet","ZombieFireVirus","CursedDoll",
              "BloodOfTimShakomontus","MagicStatueOfFeeb","SqueezeBabyOfDacron",
              "ScooterWeapon","GauntletOfStones","MopokeFeatherWand","PossessedSausage",
              "JarOfDadToenails","UnholyJandal","GoatFinger","CrowFinger","PossumFinger",
              "GoatFingerGate","CrowFingerGate","PossumFingerGate","SamRunner",
              "MopokeShambler","UndeadGoat","RotPossum","CursedCrow","StationHusk",
              "MallBrute","LibraryShade","CemeteryGhoul","TombWisp","MopokeGlimpse","SamHiding","SamCompanion","SamEscapeRunner","HouseDoorbell","TheMopoke","SamStoryHandler"
          ):
              assert f"class {cls}" in zscript, cls
          assert "SAML ABCDEF" in zscript
          assert "SAMF ABCDEF" in zscript

          # MAP01 story-flow regression checks: Dad starts in backyard, Sam runs
          # from there, and the physical front-door bell exists.
          map_i=next(i for i,(n,_) in enumerate(entries) if n=="MAP01")
          things_blob=next(body for n,body in entries[map_i+1:map_i+12] if n=="THINGS")
          things=[struct.unpack_from("<hhhhh",things_blob,o) for o in range(0,len(things_blob),10)]
          backyard_start=[t for t in things if t[3]==1]
          assert backyard_start and backyard_start[0][1] >= 1300, backyard_start
          assert any(t[3]==15113 for t in things), "missing SamEscapeRunner"
          assert any(t[3]==15710 for t in things), "missing HouseDoorbell"
          assert sum(1 for t in things if t[3]==15720) >= 3, "missing HouseStreetLamp"
          assert sum(1 for t in things if t[3]==15721) >= 4, "missing HouseTree"
          assert sum(1 for t in things if t[3] in (15722,15723)) >= 3, "missing parked cars"
          assert all(any(t[3]==typ for t in things) for typ in (15724,15725,15726,15727)), "missing playground props"

          vert_blob=next(body for n,body in entries[map_i+1:map_i+12] if n=="VERTEXES")
          line_blob=next(body for n,body in entries[map_i+1:map_i+12] if n=="LINEDEFS")
          verts=[struct.unpack_from("<hh",vert_blob,o) for o in range(0,len(vert_blob),4)]
          playground_exit=[]
          front_door_lines=0
          for o in range(0,len(line_blob),14):
              v1,v2,flags,special,tag,sf,sb=struct.unpack_from("<HHHHHHH",line_blob,o)
              if special==11:
                  playground_exit.append(tuple(sorted((verts[v1],verts[v2]))))
              if special==1:
                  front_door_lines+=1
          assert playground_exit, playground_exit
          assert all(seg[0][0]==-2050 and seg[1][0]==-2050 and
                     -960 <= seg[0][1] < seg[1][1] <= -832
                     for seg in playground_exit), playground_exit
          assert front_door_lines==2, front_door_lines


          print(f"Standalone IWAD validation passed: {wad.stat().st_size} bytes, {count} lumps, sector counts={sector_counts}")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Install only the Sam and the Mopoke IWAD
        run: |
          set -euo pipefail
          ASSETS=engine/doom/src/main/assets
          mkdir -p "$ASSETS"
          cp game/doomtc/build/sam-and-the-mopoke.wad "$ASSETS/"
          rm -f "$ASSETS/freedoom1.wad" "$ASSETS/freedoom2.wad" "$ASSETS/freedoom-manual.pdf"
          rm -f "$ASSETS/sam-and-the-mopoke.pk3" "$ASSETS/sam-and-the-mopoke-map.wad"
          test -s "$ASSETS/sam-and-the-mopoke.wad"

      - name: Brand launcher and boot the IWAD directly
        working-directory: engine
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path("doom/src/main/res/values/strings.xml")
          s=p.read_text()
          s=s.replace('<string name="app_name">Freedoom</string>',
                      '<string name="app_name">Sam and the Mopoke</string>')
          s=s.replace('Welcome to Freedoom','Sam and the Mopoke')
          p.write_text(s)

          p=Path("doom/build.gradle.kts")
          s=p.read_text().replace(
              'applicationId = "com.msa.freedoom"',
              'applicationId = "com.samandthemopoke.house42v15"'
          )
          # Installer-safe native libraries: extract on device instead of mmap.
          # The Samsung Z Flip 6 is arm64; do not bundle unneeded 32-bit/x86 ELF.
          assert 'useLegacyPackaging = false' in s
          s=s.replace('useLegacyPackaging = false','useLegacyPackaging = true')
          assert 'versionName = "0.50.0"' in s
          s=s.replace('versionName = "0.50.0"',
                      'versionName = "0.50.15-house42"\n        ndk { abiFilters += setOf("arm64-v8a") }')
          p.write_text(s)

          p=Path("doom/src/main/java/com/msa/freedoom/Utils.kt")
          lines=p.read_text().splitlines()
          lines=[line for line in lines if 'copyAsset' not in line or ('freedoom1.wad' not in line and 'freedoom2.wad' not in line)]
          p.write_text("\n".join(lines)+"\n")

          # Android-only input fix: no modifications to the Doom engine itself.
          # Preserve default gamepad input while separating move/look/fire/use.
          p=Path("doom/src/main/jni/Clibs_OpenTouch/idtech1/touch_interface.cpp")
          src=p.read_text()
          a=src.index("void TouchInterface::createControlsDoom(")
          b=src.index("void TouchInterface::createControlsDoom3(",a)
          controls=src[a:b]
          replacements=[
            ('"attack", touchcontrols::RectF(20, 7, 23, 10)', '"attack", touchcontrols::RectF(22.3, 9.1, 25.4, 12.1)'),
            ('"use", touchcontrols::RectF(23, 6, 26, 9)', '"use", touchcontrols::RectF(22.3, 5.3, 25.4, 8.3)'),
            ('"keyboard", touchcontrols::RectF(8, 0, 10, 2), "keyboard", KEY_SHOW_KBRD, false, false', '"keyboard", touchcontrols::RectF(8, 0, 10, 2), "keyboard", KEY_SHOW_KBRD, false, true'),
            ('"show_weapons", touchcontrols::RectF(12, 14, 14, 16)', '"show_weapons", touchcontrols::RectF(11, 0, 14, 2)'),
            ('"touch", touchcontrols::RectF(17, 4, 26, 16)', '"touch", touchcontrols::RectF(12.5, 4, 21.5, 12.7)'),
            ('"stick", touchcontrols::RectF(0, 7, 8, 16)', '"stick", touchcontrols::RectF(0, 8, 8.5, 15.4)'),
          ]
          for old,new in replacements:
              assert controls.count(old)==1,(old,controls.count(old))
              controls=controls.replace(old,new)
          src=src[:a]+controls+src[b:]
          p.write_text(src)

          # Explicit controller connection and disconnection events update the
          # overlay on the SDL render thread, keeping gamepad input independent.
          p=Path("doom/src/main/jni/Clibs_OpenTouch/touch_interface_base.h")
          src=p.read_text()
          marker="    void hideControls(void);"
          assert src.count(marker)==1
          src=src.replace(marker,"    bool controllerHidesTouch = false;\n    void setTouchOverlayVisible(bool visible);\n"+marker)
          p.write_text(src)

          p=Path("doom/src/main/jni/Clibs_OpenTouch/touch_interface_base.cpp")
          src=p.read_text()
          marker="void TouchInterfaceBase::hideControls(void)"
          assert src.count(marker)==1
          src=src.replace(marker,'''void TouchInterfaceBase::setTouchOverlayVisible(bool visible)
          {
          controllerHidesTouch = !visible;
          if(currentScreenMode == TS_GAME && tcGameMain)
          tcGameMain->setEnabled(visible);
          if(!visible && tcCustomButtons)
          tcCustomButtons->setEnabled(false);
          }

          '''+marker)
          marker="void TouchInterfaceBase::frameControls(bool REND_FRAMEBUFFER, bool REND_TOUCH)\n{"
          assert src.count(marker)==1
          src=src.replace(marker,marker+'''
          // Screen-mode changes can re-enable the game HUD. Respect physical pads.
          if(controllerHidesTouch)
          {
          if(tcGameMain && tcGameMain->isEnabled()) tcGameMain->setEnabled(false);
          if(tcCustomButtons && tcCustomButtons->isEnabled()) tcCustomButtons->setEnabled(false);
          }
          ''')
          p.write_text(src)

          p=Path("doom/src/main/jni/Clibs_OpenTouch/android_jni_inc.cpp")
          src=p.read_text()
          assert src.count('#include <time.h>')==1
          src=src.replace('#include <time.h>','#include <time.h>\n#include <atomic>')
          marker="static TouchInterface touchInterface;"
          assert src.count(marker)==1
          src=src.replace(marker,marker+'''
          static std::atomic<int> requestedTouchOverlay(-1);
          ''')
          marker="int EXPORT_ME\nJAVA_FUNC(renderControls)(JNIEnv *env, jobject obj)"
          assert src.count(marker)==1
          src=src.replace(marker,'''void EXPORT_ME
          JAVA_FUNC(setTouchOverlayEnabled)(JNIEnv *env, jclass klass, jboolean enabled)
          {
          requestedTouchOverlay.store(enabled ? 1 : 0);
          }

          '''+marker)
          marker="void frameControlsSDLCallback(void)\n{\n    touchInterface.newGameFrame();"
          assert src.count(marker)==1
          src=src.replace(marker,'''void frameControlsSDLCallback(void)
          {
          int overlay=requestedTouchOverlay.exchange(-1);
          if(overlay>=0) touchInterface.setTouchOverlayVisible(overlay!=0);
          touchInterface.newGameFrame();''')
          p.write_text(src)

          p=Path("doom/src/main/java/org/libsdl/app/NativeLib.java")
          src=p.read_text()
          marker="    public static native int renderControls();"
          assert src.count(marker)==1
          src=src.replace(marker,marker+"\n    public static native void setTouchOverlayEnabled(boolean enabled);")
          p.write_text(src)

          # UI-thread input events request changes but only the native render
          # thread touches C++ TouchControls objects, avoiding GL races.
          p=Path("doom/src/main/java/com/msa/freedoom/Game.kt")
          src=p.read_text()
          marker="import android.os.Bundle"
          assert src.count(marker)==1
          src=src.replace(marker,marker+'''
          import android.hardware.input.InputManager
          import android.view.InputDevice
          import org.libsdl.app.NativeLib
          ''')
          src=src.replace('class Game : SDLActivity() {', '''class Game : SDLActivity() {
          private val inputChangeListener = object : InputManager.InputDeviceListener {
          override fun onInputDeviceAdded(deviceId: Int) = updateGamepadPresence()
          override fun onInputDeviceRemoved(deviceId: Int) = updateGamepadPresence()
          override fun onInputDeviceChanged(deviceId: Int) = updateGamepadPresence()
          }
          private fun updateGamepadPresence() {
          val hasPad=InputDevice.getDeviceIds().any { id ->
            val d=InputDevice.getDevice(id)
            d != null && !d.isVirtual &&
              ((d.sources and InputDevice.SOURCE_GAMEPAD)==InputDevice.SOURCE_GAMEPAD ||
               (d.sources and InputDevice.SOURCE_JOYSTICK)==InputDevice.SOURCE_JOYSTICK)
          }
          // JNI is loaded by SDLActivity; on the first start it may still be
          // loading, so retry once from onWindowFocusChanged/onResume.
          try { NativeLib.setTouchOverlayEnabled(!hasPad) }
          catch (_: UnsatisfiedLinkError) {}
          }
          ''')
          src=src.replace('''        super.onCreate(savedInstanceState)
          }''','''        super.onCreate(savedInstanceState)
          getSystemService(InputManager::class.java)
            ?.registerInputDeviceListener(inputChangeListener, null)
          updateGamepadPresence()
          }
          override fun onResume() {
          super.onResume()
          updateGamepadPresence()
          }''')
          src=src.replace('''        Utils.onWindowFocusChanged(this, hasFocus)''','''        Utils.onWindowFocusChanged(this, hasFocus)
          if(hasFocus) updateGamepadPresence()''')
          src=src.replace('''        super.onDestroy()
          // The engine''','''        getSystemService(InputManager::class.java)
            ?.unregisterInputDeviceListener(inputChangeListener)
          super.onDestroy()
          // The engine''')
          assert 'NativeLib.setTouchOverlayEnabled(!hasPad)' in src
          p.write_text(src)
          PY

          cat > doom/src/main/java/com/msa/freedoom/EntryActivity.kt <<'KOT'
          package com.msa.freedoom

          import android.content.Intent
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import com.beloko.touchcontrols.GamePadFragment
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          class EntryActivity : AppCompatActivity() {
              private var launched = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (launched) return
                  launched = true

                  AppSettings.reloadSettings(application)
                  AppSettings.resetBaseDir(application)
                  GamePadFragment.gamepadActions = Utils.getGameGamepadConfig(resources)

                  lifecycleScope.launch {
                      val base = AppSettings.getQuakeFullDir()
                      withContext(Dispatchers.IO) {
                          AppSettings.createDirectories(application)
                          Utils.copyAsset(this@EntryActivity, "sam-and-the-mopoke.wad", base)
                          Utils.copyAsset(this@EntryActivity, "uzdoom.pk3", "$base/res")
                          Utils.copyAsset(this@EntryActivity, "uzdoom_game_support.pk3", "$base/res")
                          Utils.copyAsset(this@EntryActivity, "game_widescreen_gfx.pk3", base)
                          Utils.copyAsset(this@EntryActivity, "lights.pk3", base)
                          Utils.copyAsset(this@EntryActivity, "brightmaps.pk3", base)
                          Utils.copyAsset(this@EntryActivity, "gzdoom.sf2", base)
                          Utils.copyAsset(this@EntryActivity, "gzdoom.sf2", "$base/soundfonts")
                      }

                      startActivity(Intent(this@EntryActivity, Game::class.java).apply {
                          action = Intent.ACTION_MAIN
                          putExtra("res_div", AppSettings.getIntOption(this@EntryActivity, "gzdoom_res_div", 1))
                          putExtra("game_path", base)
                          putExtra("game", "com.samandthemopoke.house42v15")
                          putExtra("args", "-iwad sam-and-the-mopoke.wad +map MAP01")
                      })
                      finish()
                  }
              }
          }
          KOT

      - name: Build Android Doom APK
        working-directory: engine
        run: |
          set -euo pipefail
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :doom:assembleDebug --stacktrace

      - name: Verify APK ships one standalone game IWAD
        run: |
          set -euo pipefail
          APK="$(find engine/doom/build/outputs/apk -type f -name '*debug*.apk' | head -n1)"
          test -n "$APK"
          python3 - "$APK" <<'PY'
          import sys, zipfile
          apk=sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              names=set(z.namelist())
              target="assets/sam-and-the-mopoke.wad"
              assert target in names
              assert "assets/freedoom2.wad" not in names
              assert "assets/sam-and-the-mopoke.pk3" not in names
              assert "assets/sam-and-the-mopoke-map.wad" not in names
              with z.open(target) as f:
                  assert f.read(4) == b"IWAD"
          print("APK contains the standalone Sam and the Mopoke IWAD and no external game-data mod stack")
          PY
          cp "$APK" Mopoke-Horror-House42-v16-Doom.apk

      - name: Verify Gradle-signed native installer variant
        run: |
          set -euo pipefail
          APK="$(find engine/doom/build/outputs/apk -type f -name '*debug*.apk' | head -n1)"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          python3 - "$APK" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert z.testzip() is None
              libs=[i for i in z.infolist() if i.filename.startswith("lib/") and i.filename.endswith(".so")]
              assert len(libs)>=8, len(libs)
              assert {i.filename.split("/")[1] for i in libs} == {"arm64-v8a"}
              assert all(i.compress_type == zipfile.ZIP_DEFLATED for i in libs)
              assert z.read("assets/sam-and-the-mopoke.wad")[:4] == b"IWAD"
              print(f"Gradle installer validation passed: {len(libs)} compressed arm64 native libraries")
          PY

      - name: Upload Sam and the Mopoke APK
        uses: actions/upload-artifact@v4
        with:
          name: Mopoke-Horror-House42-v16-Doom-APK
          path: Mopoke-Horror-House42-v16-Doom.apk
          if-no-files-found: error
          retention-days: 3
