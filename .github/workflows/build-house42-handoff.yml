name: Build 42 Arnold MAP01 AI handoff

on:
  workflow_dispatch:
  push:
    branches:
      - house42-map-handoff-final
      - house42-map-handoff-v2-detail
      - house42-map-handoff-v3-correct-elevations
    paths:
      - 'doomtc/house42_map.py'
      - 'doomtc/house42_assets.py'
      - 'doomtc/house42_layout.json'
      - 'doomtc/build_house42_handoff.py'
      - 'HOUSE42_HANDOFF.md'
      - '.github/workflows/build-house42-handoff.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out map handoff branch
        uses: actions/checkout@v4

      - name: Build clean MAP01 handoff
        run: |
          set -euo pipefail
          python3 doomtc/build_house42_handoff.py

      - name: Validate handoff WAD and package
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, struct, zipfile

          root=Path("doomtc/house42_handoff_build")
          wad=root/"42-Arnold-MAP01-geometry-and-textures.wad"
          z=Path("42-Arnold-MAP01-AI-HANDOFF-v3.zip")
          assert wad.is_file() and wad.stat().st_size>10000
          assert z.is_file() and z.stat().st_size>10000

          b=wad.read_bytes()
          assert b[:4]==b"PWAD"
          count,diroff=struct.unpack_from("<II",b,4)
          names=[]
          for i in range(count):
              pos,size,raw=struct.unpack_from("<II8s",b,diroff+i*16)
              assert pos+size<=len(b)
              names.append(raw.rstrip(b"\0").decode("ascii"))
          for req in (
              "MAP01","THINGS","LINEDEFS","SIDEDEFS","VERTEXES","SECTORS",
              "H42WALL","H42KTCH","H42BATH","H42SIDN","H42FRNT","H42WIND",
              "H42FWIN","H42RWIN","H42REAR","H42RDR",
              "H42CARP","H42WOOD","H42ASPH","H42GRAS","H42SAFE",
              "H42LWN","H42VERG","H42DRV","H42PATH","H42ROAD","H42BED",
              "H44ROOF","H40ROOF","H39ROOF","H37ROOF","H35ROOF",
              "DECORATE","HILXA1","HILXA5","BINRA0","BINYA0","SHRBA0"
          ):
              assert req in names, req

          manifest=json.loads((root/"MANIFEST.json").read_text())
          assert "DECORATE" in manifest["engine_dependency"]
          assert manifest["stats"]["handoff_wad_things"] >= 20
          assert len(manifest["textures"])>=15
          assert len(manifest["flats"])>=15

          with zipfile.ZipFile(z) as zz:
              packed=set(zz.namelist())
              for req in (
                  "42-Arnold-MAP01-geometry-and-textures.wad",
                  "house42_map.py","house42_layout.json","MANIFEST.json",
                  "README_MAP_HANDOFF.md","SOURCE_FIDELITY.md",
                  "42-Arnold-overhead-plan.svg"
              ):
                  assert req in packed, req
          # Verify the actual map contains the player plus environment props,
          # including Workmate and the three kerbside bins.
          idx=names.index("THINGS")
          # Re-read THINGS by directory index.
          pos,size,raw=struct.unpack_from("<II8s",b,diroff+idx*16)
          things=[struct.unpack_from("<hhhhh",b,pos+i) for i in range(0,size,10)]
          types=[t[3] for t in things]
          assert 1 in types
          assert 15729 in types, "missing Hilux Workmate"
          assert all(t in types for t in (15728,15730,15731)), "missing kerb bins"
          assert types.count(15721) >= 8, "not enough trees"
          assert types.count(15720) >= 3, "not enough street lamps/poles"

          layout=json.loads((root/"house42_layout.json").read_text())
          assert layout["house"]["orientation"]["front"].startswith("south")
          assert layout["house"]["orientation"]["rear"].startswith("north")
          assert max(layout["story_flow"]["front_door"]["bounds"][1::2]) <= 400
          assert min(layout["story_flow"]["rear_door"]["bounds"][1::2]) >= 1296
          assert layout["story_flow"]["front_door"]["texture"]=="H42FRNT"
          assert layout["story_flow"]["rear_door"]["texture"]=="H42RDR"
          print("42 Arnold v3 front/rear orientation validation passed")
          PY

      - name: Upload map-only AI handoff
        uses: actions/upload-artifact@v4
        with:
          name: 42-Arnold-MAP01-AI-HANDOFF-v3
          path: 42-Arnold-MAP01-AI-HANDOFF-v3.zip
          if-no-files-found: error
          retention-days: 14
