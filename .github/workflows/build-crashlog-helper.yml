name: Build crash-log helper DEX

on:
  push:
    branches: [crashlog-downloads]
    paths:
      - 'diagnostic/**'
      - '.github/workflows/build-crashlog-helper.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Compile CrashActivity and dex it
        run: |
          set -euo pipefail
          mkdir -p build/classes build/dex
          javac -source 8 -target 8             -classpath "$ANDROID_HOME/platforms/android-36/android.jar"             -d build/classes diagnostic/CrashActivity.java
          "$ANDROID_HOME/build-tools/36.0.0/d8"             --release             --lib "$ANDROID_HOME/platforms/android-36/android.jar"             --output build/dex             build/classes/com/msa/freedoom/CrashActivity.class
          mv build/dex/classes.dex build/classes23.dex
          test -s build/classes23.dex

      - name: Upload helper dex
        uses: actions/upload-artifact@v4
        with:
          name: zombie-mopoke-crashlog-helper
          path: build/classes23.dex
          if-no-files-found: error
          retention-days: 3
