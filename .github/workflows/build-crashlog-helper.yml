name: Build crash-log helper DEX

on:
  push:
    branches: [crashlog-downloads]
    paths:
      - 'diagnostic/**'
      - '.github/workflows/build-crashlog-helper.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Compile crash logger classes
        run: |
          set -euo pipefail
          mkdir -p build/classes build/stubs/org/libsdl/app2012 build/dex

          cat > build/stubs/org/libsdl/app2012/SDLActivity.java <<'JAVA'
          package org.libsdl.app2012;
          public class SDLActivity extends android.app.Activity {
              protected String[] getLibraries() { return new String[0]; }
          }
          JAVA

          javac -source 8 -target 8             -classpath "$ANDROID_HOME/platforms/android-36/android.jar"             -d build/stubclasses             build/stubs/org/libsdl/app2012/SDLActivity.java

          javac -source 8 -target 8             -classpath "$ANDROID_HOME/platforms/android-36/android.jar:build/stubclasses"             -d build/classes             diagnostic/CrashActivity.java diagnostic/Glog.java

          "$ANDROID_HOME/build-tools/36.0.0/d8"             --release             --lib "$ANDROID_HOME/platforms/android-36/android.jar"             --classpath build/stubclasses             --output build/dex             build/classes/com/msa/freedoom/CrashActivity.class             build/classes/com/msa/freedoom/Glog.class

          mv build/dex/classes.dex build/classes23.dex
          test -s build/classes23.dex

      - name: Upload helper dex
        uses: actions/upload-artifact@v4
        with:
          name: zombie-mopoke-crashlog-helper
          path: build/classes23.dex
          if-no-files-found: error
          retention-days: 3
